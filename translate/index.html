<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="翻訳"><meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json">

<title>かんたん翻訳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: one column like a phone translator — language bar, input card, result card */
:root{--bg:#fff;--fg:#202124;--sub:#5f6368;--line:#dadce0;--card:#f8f9fa;--accent:#1a73e8;--accent-soft:#e8f0fe;--tip:#3c4043;--tip-fg:#fff;
 --font:"Noto Sans JP","Noto Sans Thai",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#e8eaed;--sub:#9aa0a6;--line:#3c4043;--card:#2d2e31;--accent:#8ab4f8;--accent-soft:#2a3a55;--tip:#e8eaed;--tip-fg:#202124;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202124;--fg:#e8eaed;--sub:#9aa0a6;--line:#3c4043;--card:#2d2e31;--accent:#8ab4f8;--accent-soft:#2a3a55;--tip:#e8eaed;--tip-fg:#202124;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-block:12px 24px}
header{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--sub)}
header .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
header b{color:var(--fg);font-weight:500}
.langs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px}
.lang{text-align:center;color:var(--accent);font-weight:500;font-size:15px;padding:8px}
.swap{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--sub);font-size:20px;cursor:pointer}
.swap:active,.swap:focus-visible{background:var(--accent-soft);outline:none}
.card{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.out{background:var(--card);border-color:transparent;min-height:150px}
.label{font-size:13px;color:var(--sub)}
textarea{border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:inherit;font-size:22px;line-height:1.4;min-height:110px;width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--sub);cursor:pointer;display:grid;place-items:center}
.icon:active,.icon:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
.icon svg{width:22px;height:22px;fill:currentColor}
.go{border:0;border-radius:999px;background:var(--accent);color:var(--bg);font:inherit;font-weight:500;font-size:15px;padding:10px 22px;cursor:pointer}
.go:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.count{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
#result{font-size:24px;line-height:1.45;color:var(--accent);min-height:70px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-wrap:anywhere}
#result.wait{color:var(--sub);font-size:16px}
.dots::after{content:"";animation:dots 1s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.note{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.note i{width:8px;height:8px;border-radius:50%;background:#34a853;display:inline-block}
#tip{position:absolute;left:12px;right:12px;bottom:calc(100% - 6px);background:var(--tip);color:var(--tip-fg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.row .count{margin-right:auto}
#mic.on{background:var(--accent);color:var(--bg);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent-soft)}}
.hint{font-size:13px;color:var(--sub);line-height:1.5}
.listen{background:var(--accent-soft);border-radius:20px;padding-block:18px 20px;padding-inline:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ltitle{font-size:18px;font-weight:700}
.lsub{margin:0;font-size:13px;color:var(--sub)}
.bigmic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--bg);cursor:pointer;display:grid;place-items:center;margin-block:6px}
.bigmic svg{width:40px;height:40px;fill:currentColor}
.bigmic.on{animation:pulse 1.2s ease-in-out infinite}
.bigmic:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.lthai{font-size:22px;font-weight:700;color:var(--accent)}
.lthai-sub{font-size:14px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
<div class="app">
 <header><span class="logo">文</span><b id="appname">かんたん翻訳</b></header>
 <div class="langs">
  <div class="lang" id="from">日本語</div>
  <button class="swap" id="swap" aria-label="言語を入れ替える">⇄</button>
  <div class="lang" id="to">タイ語</div>
 </div>
 <div class="listen" id="listen" hidden>
  <div class="ltitle">相手の言葉を聞く</div>
  <p class="lsub">タイの人にスマホを向けて、話してもらってください</p>
  <button class="bigmic" id="bigmic" aria-label="タイ語で話してもらう"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
  <div class="lthai">กรุณาพูดภาษาไทย</div>
  <div class="lthai-sub">กดปุ่มไมค์แล้วพูดได้เลย</div>
 </div>
 <div class="card">
  <textarea id="src" placeholder="テキストを入力" aria-label="翻訳する文"></textarea>
  <div class="row">
   <button class="icon" id="mic" aria-label="話して入力"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button>
   <span class="count" id="count">0 / 5,000</span>
   <button class="go" id="go">翻訳</button>
  </div>
  <div class="hint" id="hint" hidden></div>
 </div>
 <div class="card out">
  <div id="tip" hidden></div>
  <span class="label" id="outlabel">タイ語</span>
  <div id="result" class="wait">ここに翻訳が表示されます</div>
  <div class="row">
   <span class="note"><i></i><span id="ai">AI が意味を正確に読み取ります</span></span>
   <button class="icon" id="speak" aria-label="もう一度聞く"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg></button>
  </div>
 </div>
</div>

const UI={
 th:{from:"日本語",to:"タイ語",ph:"テキストを入力",go:"翻訳",wait:"ここに翻訳が表示されます",busy:"翻訳しています",ai:"AI が意味を正確に読み取ります",name:"かんたん翻訳",swap:"言語を入れ替える"},
 ja:{from:"タイ語",to:"日本語",ph:"タイ語を入力（ป้อนข้อความภาษาไทย）",go:"翻訳",wait:"タイの人の言葉が、ここに日本語で出ます",busy:"翻訳しています",ai:"AI がタイ語を正確に聞き取ります",name:"かんたん翻訳",swap:"言語を入れ替える"}
};
let mode="th",ctx=null,last=null;const bufs={},bag={th:[],ja:[]};
const $=id=>document.getElementById(id);
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function unlock(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)()}if(ctx.state!=="running")ctx.resume();}
async function play(item){unlock();const k=mode+item.i;if(!bufs[k])bufs[k]=await ctx.decodeAudioData(b64(item[2]));const s=ctx.createBufferSource();s.buffer=bufs[k];s.connect(ctx.destination);s.start()}
function pick(){const list=DATA[mode];if(!bag[mode].length){bag[mode]=list.map((_,i)=>i).sort(()=>Math.random()-.5);if(last&&bag[mode][0]===last.i&&list.length>1)bag[mode].push(bag[mode].shift())}const i=bag[mode].shift();const it=list[i];it.i=i;return it}
function setMode(m){mode=m;const u=UI[m];$("from").textContent=u.from;$("to").textContent=u.to;$("outlabel").textContent=u.to;$("src").placeholder=u.ph;$("go").textContent=u.go;$("ai").textContent=u.ai;$("appname").textContent=u.name;$("swap").setAttribute("aria-label",u.swap);$("listen").hidden=m!=="ja";$("hint").hidden=true;$("src").value="";$("count").textContent="0 / 5,000";reset()}
function reset(){last=null;$("tip").hidden=true;const r=$("result");r.className="wait";r.textContent=UI[mode].wait}
// タイ語→日本語：ふだんは本当に訳す。4 回に 1 回くらい、すごみのセリフ（2 回続けない）
let menacedLast=false;
async function realTranslate(text){
 try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=ja&dt=t&q="+encodeURIComponent(text));
  const j=await r.json();return j[0].map(x=>x[0]).join("")}catch(e){}
 try{const r=await fetch("https://api.mymemory.translated.net/get?langpair=th|ja&q="+encodeURIComponent(text));
  const j=await r.json();return j.responseData.translatedText}catch(e){}
 return null}
function speakJa(text){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";
 const v=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace("_","-").startsWith("ja"));const best=v.find(x=>/Enhanced|Premium|拡張|O-ren|Otoya/.test(x.name))||v.find(x=>/Kyoko/.test(x.name))||v[0];if(best)u.voice=best;speechSynthesis.speak(u)}
function unlockSpeech(){if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}
function translate(){unlock();const text=$("src").value.trim();if(!text){$("src").focus();return}
 const r=$("result");$("tip").hidden=true;r.className="wait dots";r.textContent=UI[mode].busy;
 if(mode==="th"){const it=pick();setTimeout(()=>{last=it;r.className="";r.textContent=it[0];play(it)},700+Math.random()*500);return}
 unlockSpeech();
 const menace=!menacedLast&&Math.random()<0.25;menacedLast=menace;
 if(menace){const it=pick();setTimeout(()=>{last=it;r.className="";r.textContent=it[0];play(it)},800+Math.random()*500);return}
 const t0=Date.now();realTranslate(text).then(ja=>{setTimeout(()=>{
  if(!ja){r.className="wait";r.textContent="ネットにつながっていないため、翻訳できません";return}
  last={0:ja,real:true};r.className="";r.textContent=ja;speakJa(ja)},Math.max(0,600-(Date.now()-t0)))})}
// 音声入力
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$("mic").addEventListener("click",()=>{unlock();if(mode==="ja")unlockSpeech();
 const h=$("hint");
 if(rec){rec.stop();return}
 if(!SR){h.textContent=mode==="th"?"キーボードのマイクを押して話してください。":"กดไมค์บนแป้นพิมพ์แล้วพูดได้เลย（キーボードのマイクで話してもらってください）";h.hidden=false;$("src").focus();return}
 rec=new SR();rec.lang=mode==="th"?"ja-JP":"th-TH";rec.interimResults=true;rec.continuous=false;
 $("mic").classList.add("on");$("bigmic").classList.add("on");h.textContent=mode==="th"?"どうぞ話してください":"พูดได้เลย（どうぞ話してもらってください）";h.hidden=false;
 rec.onresult=e=>{let s="";for(const x of e.results)s+=x[0].transcript;$("src").value=s;$("count").textContent=s.length.toLocaleString()+" / 5,000"};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){h.textContent=mode==="th"?"マイクが使えません。キーボードのマイクを押して話してください。":"ใช้ไมค์ไม่ได้ กดไมค์บนแป้นพิมพ์แล้วพูด（マイクが使えません。キーボードのマイクで話してもらってください）";$("src").focus()}};
 rec.onend=()=>{$("mic").classList.remove("on");$("bigmic").classList.remove("on");rec=null;if(!/ません|ไม่ได้/.test(h.textContent))h.hidden=true;if($("src").value.trim())translate()};
 try{rec.start()}catch(e){rec=null;$("mic").classList.remove("on")}});
$("go").addEventListener("click",translate);
$("src").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();translate()}});
$("src").addEventListener("input",e=>{$("count").textContent=e.target.value.length.toLocaleString()+" / 5,000"});
$("swap").addEventListener("click",()=>{unlock();setMode(mode==="th"?"ja":"th")});
$("bigmic").addEventListener("click",()=>$("mic").click());
$("speak").addEventListener("click",()=>{if(!last)return;last.real?speakJa(last[0]):play(last)});
// 長押しで本当の意味（持ち主だけが知っている）
let lp;const res=$("result");
const showTip=()=>{if(!last||last.real)return;const t=$("tip");t.textContent="本当の意味："+last[1];t.hidden=false};
res.addEventListener("pointerdown",()=>{lp=setTimeout(showTip,600)});
["pointerup","pointerleave","pointercancel"].forEach(ev=>res.addEventListener(ev,()=>clearTimeout(lp)));
document.addEventListener("pointerdown",e=>{if(!res.contains(e.target))$("tip").hidden=true});
res.addEventListener("contextmenu",e=>e.preventDefault());
</script>
